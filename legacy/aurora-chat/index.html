<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Aurora Chat</title>
<meta name="description" content="یک پلتفرم چت مدرن و سریع" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- پس‌زمینه‌ی متحرک Aurora — امضای بصری صفحه -->
  <div class="aurora" aria-hidden="true">
    <div class="aurora__orb aurora__orb--1"></div>
    <div class="aurora__orb aurora__orb--2"></div>
    <div class="aurora__orb aurora__orb--3"></div>
    <div class="aurora__noise"></div>
  </div>

  <div id="app-root">

    <!-- ============================================================
         AUTH SCREEN
         ============================================================ -->
    <section id="auth-screen" class="screen is-active">
      <div class="auth-card glass">
        <div class="auth-brand">
          <div class="auth-brand__mark">A</div>
          <div class="auth-brand__name">Aurora Chat</div>
        </div>

        <div class="auth-tabs" role="tablist">
          <button class="tab-btn is-active" data-tab="login" role="tab" aria-selected="true">ورود</button>
          <button class="tab-btn" data-tab="register" role="tab" aria-selected="false">ثبت‌نام</button>
        </div>

        <!-- فرم ورود -->
        <form id="login-form" class="auth-form" autocomplete="on">
          <div class="form-group">
            <label class="form-label" for="login-email">ایمیل</label>
            <input class="form-input" id="login-email" name="email" type="email" placeholder="you@example.com" required />
          </div>
          <div class="form-group">
            <label class="form-label" for="login-password">رمز عبور</label>
            <input class="form-input" id="login-password" name="password" type="password" placeholder="••••••••" required />
          </div>
          <button class="btn-primary" type="submit" id="login-submit">ورود به حساب</button>
          <p class="auth-error" id="login-error"></p>
        </form>

        <!-- فرم ثبت‌نام -->
        <form id="register-form" class="auth-form" autocomplete="on" style="display:none;">
          <div class="form-group">
            <label class="form-label" for="register-username">نام کاربری</label>
            <input class="form-input" id="register-username" name="username" type="text" placeholder="mahdi_dev" required />
          </div>
          <div class="form-group">
            <label class="form-label" for="register-email">ایمیل</label>
            <input class="form-input" id="register-email" name="email" type="email" placeholder="you@example.com" required />
          </div>
          <div class="form-group">
            <label class="form-label" for="register-password">رمز عبور</label>
            <input class="form-input" id="register-password" name="password" type="password" placeholder="حداقل ۶ کاراکتر" required minlength="6" />
          </div>
          <button class="btn-primary" type="submit" id="register-submit">ساخت حساب</button>
          <p class="auth-error" id="register-error"></p>
        </form>

        <p class="auth-hint">با ادامه، شرایط استفاده و حریم خصوصی را می‌پذیری.</p>
      </div>
    </section>

    <!-- ============================================================
         MAIN APP SCREEN
         ============================================================ -->
    <section id="app-screen" class="screen">

      <!-- ---------- Sidebar ---------- -->
      <aside class="sidebar glass" id="sidebar">
        <div class="sidebar__header">
          <div class="brand">
            <div class="brand__mark"></div>
            <span>Aurora</span>
          </div>
          <button class="icon-btn" id="logout-btn" title="خروج" aria-label="خروج از حساب">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          </button>
        </div>

        <div class="search-wrap">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input class="search-input" id="search-input" type="text" placeholder="جستجوی گفتگو یا کاربر…" />
        </div>

        <div class="conversation-list" id="conversation-list">
          <!-- اسکلتون لودینگ اولیه -->
          <div class="skeleton-item"><div class="skeleton-box" style="width:44px;height:44px;border-radius:50%;"></div><div style="flex:1;"><div class="skeleton-box" style="width:70%;height:12px;margin-bottom:8px;"></div><div class="skeleton-box" style="width:50%;height:10px;"></div></div></div>
          <div class="skeleton-item"><div class="skeleton-box" style="width:44px;height:44px;border-radius:50%;"></div><div style="flex:1;"><div class="skeleton-box" style="width:60%;height:12px;margin-bottom:8px;"></div><div class="skeleton-box" style="width:40%;height:10px;"></div></div></div>
          <div class="skeleton-item"><div class="skeleton-box" style="width:44px;height:44px;border-radius:50%;"></div><div style="flex:1;"><div class="skeleton-box" style="width:80%;height:12px;margin-bottom:8px;"></div><div class="skeleton-box" style="width:35%;height:10px;"></div></div></div>
        </div>

        <div class="sidebar__footer">
          <div class="avatar avatar--sm" id="me-avatar">?</div>
          <div style="flex:1;min-width:0;">
            <div class="me-name" id="me-name">در حال بارگذاری…</div>
            <div class="me-status">آنلاین</div>
          </div>
          <button class="icon-btn" id="settings-btn" title="تنظیمات" aria-label="تنظیمات">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          </button>
        </div>
      </aside>

      <!-- ---------- Chat pane ---------- -->
      <main class="chat-pane" id="chat-pane">

        <!-- حالت خالی: هنوز گفتگویی انتخاب نشده -->
        <div class="messages" id="empty-messages">
          <div class="empty-state">
            <div class="empty-state__mark"></div>
            <h3>گفتگویی رو انتخاب کن</h3>
            <p>از لیست سمت راست یکی از مخاطب‌ها یا گروه‌ها رو باز کن تا پیام‌ها نمایش داده بشن.</p>
          </div>
        </div>

        <!-- حالت فعال: یک گفتگوی باز -->
        <div id="active-chat" style="display:none; flex-direction:column; height:100%;">
          <header class="chat-header">
            <div class="chat-header__peer">
              <button class="icon-btn mobile-back" id="mobile-back-btn" aria-label="بازگشت به لیست">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="9 18 15 12 9 6" transform="rotate(180 12 12)"/></svg>
              </button>
              <div class="avatar" id="peer-avatar">?</div>
              <div>
                <div class="chat-header__name" id="peer-name">—</div>
                <div class="chat-header__status" id="peer-status">آنلاین</div>
              </div>
            </div>
            <div class="chat-header__actions">
              <button class="icon-btn" title="تماس صوتی" aria-label="تماس صوتی">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
              </button>
              <button class="icon-btn" title="جستجو در پیام‌ها" aria-label="جستجو">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
              </button>
            </div>
          </header>

          <div class="messages" id="messages-list"></div>

          <form class="composer" id="composer-form">
            <textarea class="composer__input" id="composer-input" rows="1" placeholder="پیامت رو بنویس…" required></textarea>
            <button type="submit" class="send-btn" id="send-btn" aria-label="ارسال">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
            </button>
          </form>
        </div>

      </main>
    </section>
  </div>

  <div class="toast" id="toast"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
